<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - Admin Control</title>

    <!-- Premium UI Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="CSS/admin.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .admin-table-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            overflow: hidden;
        }

        .table {
            color: #f8fafc !important;
            margin-bottom: 0;
        }

        .table th {
            background-color: #0f172a !important;
            color: #94a3b8 !important;
            border-bottom: 2px solid #334155 !important;
            padding: 16px;
        }

        .table td {
            background-color: #1e293b !important;
            border-bottom: 1px solid #334155 !important;
            padding: 16px;
            vertical-align: middle;
        }

        .text-muted { color: #94a3b8 !important; }
        .text-secondary { color: #cbd5e1 !important; }

        .btn-action {
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .btn-status-update {
    background-color: #044321;
    color: #ffffff;
    border: 1px solid #15803d;
}
.btn-status-update:hover {
    background-color: #15803d;
    color: #ffffff;
}
    </style>
</head>

<body>

    <!-- Admin Navbar -->
    <nav class="navbar navbar-dark px-4 py-3">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fw-bold m-0 text-info">
                <i class="fa-solid fa-shield-halved me-2"></i>Admin Dashboard
            </span>
            <div class="d-flex gap-3">
                <a href="dashboard.html" class="btn btn-outline-info fw-bold btn-action">
                    <i class="fa-solid fa-arrow-left me-1"></i> User Feed
                </a>
                <button id="logout-btn" class="btn btn-outline-danger fw-bold btn-action">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Admin Main Container -->
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col">
                <h2 class="fw-extrabold text-white mb-1">Manage Reported Items</h2>
                <p class="text-muted small">Overview of all active database logs across the system</p>
            </div>
        </div>

        <!-- Table Responsive Card -->
        <div class="admin-table-card shadow-lg">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Preview</th>
                            <th>Item Details</th>
                            <th>Status</th>
                            <th>Reporter ID</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body">
                        <!-- Dynamic rows will inject here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap & SweetAlert -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Admin JS Module -->
    <script type="module" src="JS/admin.js"></script>
</body>

</html>

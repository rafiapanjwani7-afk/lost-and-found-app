<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Lost & Found Feed</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="CSS/adminauth.css">
    <style>
        body {
            background-color: #0b1329;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background-color: #1c2541;
            border: 1px solid #3a506b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            overflow: hidden;
        }

        .auth-header h3 {
            color: #00b4d8;
            font-weight: 700;
        }

        .nav-pills .nav-link {
            color: #94a3b8;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-pills .nav-link.active {
            background-color: #00b4d8;
            color: #0b1329;
        }

        .form-label {
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-control {
            background-color: #0b1329;
            border: 1px solid #3a506b;
            color: #f8fafc;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            background-color: #0b1329;
            border-color: #00b4d8;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(0, 180, 216, 0.25);
        }

        .btn-auth {
            background-color: #00b4d8;
            color: #0b1329;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-auth:hover {
            background-color: #0077b6;
            color: #ffffff;
        }

        .input-group-text {
            background-color: #0b1329;
            border: 1px solid #3a506b;
            color: #94a3b8;
        }

        /* Placeholder color enhancement for clear visibility */
        .form-control::placeholder {
            color: #94a3b8 !important;
            opacity: 0.7 !important;
        }

        /* Chrome, Safari and Opera */
        .form-control::-webkit-input-placeholder {
            color: #94a3b8 !important;
            opacity: 0.7 !important;
        }

        /* Firefox */
        .form-control::-moz-placeholder {
            color: #94a3b8 !important;
            opacity: 0.7 !important;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="auth-header text-center mb-4">
            <div class="mb-2">
                <i class="fa-solid fa-shield-halved fa-3x" style="color: #00b4d8;"></i>
            </div>
            <h3>Admin Portal</h3>
            <p class="text-secondary small">Manage system security and directory reports.</p>
        </div>

        <!-- Toggle Pills Buttons -->
        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login"
                    type="button" role="tab">
                    <i class="fa-solid fa-lock me-2"></i>Login
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-signup-tab" data-bs-toggle="pill" data-bs-target="#pills-signup"
                    type="button" role="tab">
                    <i class="fa-solid fa-user-plus me-2"></i>Register
                </button>
            </li>
        </ul>

        <!-- Forms Container Switcher -->
        <div class="tab-content" id="pills-tabContent">

            <!-- 🔑 ADMIN LOGIN FORM -->
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                <form id="adminLoginForm">
                    <div class="mb-3">
                        <label for="adminEmail" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="adminEmail" placeholder="admin@example.com"
                                required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="adminPassword" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="adminPassword" placeholder="••••••••"
                                required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth w-100">
                        Secure Authentication <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
                    </button>
                </form>
            </div>

            <!-- 📝 ADMIN SIGNUP FORM -->
            <div class="tab-pane fade" id="pills-signup" role="tabpanel">
                <form id="adminSignupForm">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="John" required>
                        </div>
                        <div class="col-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="name@domain.com" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password"
                                placeholder="Min 6 chars (A-z, 1, $)" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth w-100">
                        Register Admin Account <i class="fa-solid fa-user-shield ms-2"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Bootstrap & SweetAlert JS CDN Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Aapka main JavaScript controller links link karein -->
    <script type="module" src="JS/adminauth.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .navbar { background-color: #1e293b; border-bottom: 1px solid #334155; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; overflow: hidden; }
        .item-img { height: 200px; object-fit: cover; width: 100%; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark px-4 py-3">
        <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-bullhorn text-info me-2"></i>Lost & Found Feed</span>
        <div>
            <button class="btn btn-info text-white me-2" data-bs-toggle="modal" data-bs-target="#postModal">
                <i class="fa-solid fa-plus me-1"></i> Report Item
            </button>
            <button class="btn btn-outline-danger" id="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <h2 class="mb-4">Recent Reports</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="posts-container">
            <!-- Dynamic Post Cards will load here -->
        </div>
    </div>

    <!-- Report Item Modal -->
    <div class="modal fade" id="postModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-white" style="background-color: #1e293b; border: 1px solid #334155;">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-info">Report Lost or Found Item</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="post-form">
                        <div class="mb-3">
                            <label class="form-label">Item Name</label>
                            <input type="text" id="item-name" class="form-control bg-dark text-white border-secondary" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select id="item-status" class="form-select bg-dark text-white border-secondary">
                                <option value="Lost">Lost</option>
                                <option value="Found">Found</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description / Location</label>
                            <textarea id="item-desc" class="form-control bg-dark text-white border-secondary" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Upload Image</label>
                            <input type="file" id="item-image" class="form-control bg-dark text-white border-secondary" accept="image/*" required>
                        </div>
                        <button type="submit" class="btn btn-info w-100 text-white" id="submit-post-btn">Submit Post</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Lost & Found - Feed</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/feed.css">
</head>
<body>

    <!-- 1. Simple Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-info" href="#">
                <i class="fa-solid fa-magnifying-glass-location me-2"></i>Pak Lost & Found
            </a>
            <div>
                <a href="dashboard.html" class="btn btn-outline-info btn-sm px-3">
                    <i class="fa-solid fa-gauge me-1"></i> Dashboard
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Wrapper -->
    <div class="container my-5">
        
        <!-- Page Heading -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-info">Recent Reported Items</h2>
            <p class="text-secondary">Explore lost and found entries in your area</p>
        </div>

        <!-- 2. Premium Control Bar (Wahi floating look jo aapko pasand aaya tha) -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 bg-secondary bg-opacity-10 p-3 mb-5" style="border-radius: 12px; border: 1px solid #334155;">
            
            <!-- Left Side: Add Button -->
            <button class="btn btn-success fw-bold px-3 py-2" style="background-color: #044321; border: none; border-radius: 8px;" onclick="window.location.href='dashboard.html'">
                <i class="fa-solid fa-plus me-2"></i>Add Report An Item
            </button>

            <!-- Right Side: Filter Tabs -->
            <div class="bg-dark bg-opacity-50 p-1 d-flex gap-1" style="border-radius: 8px; border: 1px solid #475569;">
                <button class="btn btn-sm filter-btn active-filter px-3 py-1.5 fw-semibold" data-status="all" style="border-radius: 6px;">All Items</button>
                <button class="btn btn-sm filter-btn px-3 py-1.5 fw-semibold" data-status="lost" style="border-radius: 6px;">Lost</button>
                <button class="btn btn-sm filter-btn px-3 py-1.5 fw-semibold" data-status="found" style="border-radius: 6px;">Found</button>
            </div>

        </div>

        <!-- Cards Container -->
        <div id="feed-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <!-- Loading Spinner initially -->
            <div class="d-flex justify-content-center w-100 my-5">
                <div class="spinner-border text-info" role="status"></div>
            </div>
        </div>

    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- JavaScript Files -->
    <script type="module" src="JS/feed.js"></script>
</body>
</html>

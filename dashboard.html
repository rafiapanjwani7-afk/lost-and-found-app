<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found - Feed Hub</title>

    <!-- Premium UI Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="CSS/style.css">

    <style>
        /* Modern Dark Glassmorphic Dashboard Styles */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e293b;
        }

        /* Fixed Premium Hover Effect applied globally to dynamically rendered cards */
        .card {
            background: #1e293b !important;
            border: 1px solid #334155 !important;
            border-radius: 16px !important;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease !important;
        }

        .card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 12px 20px rgba(13, 202, 240, 0.15) !important;
            border-color: #0dcaf0 !important;
        }

        .form-control,
        .form-select {
            background-color: #0f172a !important;
            border: 1px solid #334155 !important;
            color: #f8fafc !important;
            border-radius: 10px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #0dcaf0 !important;
            box-shadow: 0 0 0 3px rgba(13, 202, 240, 0.2) !important;
        }

        /* Premium Custom Dark Toggle Tabs Styles */
        .btn-dark-toggle {
            background: transparent;
            color: #94a3b8;
            border: none;
            transition: all 0.25s ease;
        }

        .btn-check:checked+.btn-dark-toggle {
            background-color: #044321 !important;
            /* Premium Dark Green */
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(4, 67, 33, 0.3);
        }

        .btn-dark-toggle:hover {
            color: #f8fafc;
        }

        /* SweetAlert Main Modal Box */
        .swal2-popup {
            background-color: #1e293b !important;
            /* Dark Slate Background */
            color: #f8fafc !important;
            /* Text Color */
            border: 1px solid #334155 !important;
            /* Subtle Border */
            border-radius: 18px !important;
            /* Smooth Rounded Corners */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5) !important;
        }

        /* Titles and Content Text */
        .swal2-title {
            color: #38bdf8 !important;
            /* Light Cyan Accent */
            font-weight: 700 !important;
        }

        .swal2-html-container {
            color: #94a3b8 !important;
            /* Soft Muted Body Text */
        }

        /* Buttons Styling */
        .swal2-actions button {
            border-radius: 10px !important;
            font-weight: 600 !important;
            padding: 10px 22px !important;
        }

        /* Confirm Button (Cyan Primary) */
        .swal2-confirm {
            background-color: #0ea5e9 !important;
            border: none !important;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3) !important;
        }

        .swal2-confirm:hover {
            background-color: #0284c7 !important;
        }

        /* Cancel / Danger Button */
        .swal2-cancel {
            background-color: #334155 !important;
            color: #cbd5e1 !important;
        }

        .swal2-cancel:hover {
            background-color: #475569 !important;
        }

        /* Success / Warning / Error Icons Adjustment */
        .swal2-icon.swal2-success {
            border-color: #10b981 !important;
            color: #10b981 !important;
        }

        .swal2-icon.swal2-success [class^='swal2-success-line'] {
            background-color: #10b981 !important;
        }

        .swal2-icon.swal2-warning,
        .swal2-icon.swal2-error {
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        /* Custom Search Input Styling */
    </style>
</head>

<body>

    <!-- Premium Blurred Navbar -->
    <nav class="navbar navbar-dark px-4 py-3 position-relative" style="z-index: 1050;">
        <div class="container-fluid d-flex justify-content-between align-items-center">

            <!-- Logo Section -->
            <span class="navbar-brand mb-0 h1 fw-bold m-0">
                <i class="fa-solid fa-bullhorn text-info me-2 animate-bounce"></i>Lost & Found Feed
            </span>

            <!-- Right Aligned Actions Controls -->
            <div class="d-flex align-items-center gap-3">

                <!-- REPORT ITEM BUTTON -->
                <!-- <button class="btn btn-info text-white fw-bold px-4" style="border-radius: 10px;" data-bs-toggle="modal"
                    data-bs-target="#postModal">
                    <i class="fa-solid fa-plus me-1"></i> Report Item
                </button> -->

                <!-- Premium User Profile Dropdown -->
                <div class="dropdown position-relative" style="z-index: 1060;">
                    <div id="user-avatar"
                        class="d-flex align-items-center justify-content-center bg-info text-dark fw-bold"
                        data-bs-toggle="dropdown" aria-expanded="false"
                        style="width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;">
                        U
                    </div>

                    <!-- UL Menu list par high z-index aur proper positioning -->
                    <ul class="dropdown-menu dropdown-menu-end p-3 shadow-lg border-secondary text-center"
                        style="background-color: #1e293b; min-width: 240px; border-radius: 12px; margin-top: 10px; z-index: 9999 !important; position: absolute;">

                        <div id="menu-avatar"
                            class="d-flex align-items-center justify-content-center bg-info text-dark fw-bold mx-auto mb-2"
                            style="width: 55px; height: 55px; border-radius: 50%; font-size: 1.5rem;">
                            U
                        </div>

                        <h6 id="menu-user-name" class="text-white fw-bold mb-0">Loading...</h6>
                        <p id="menu-user-email" class="text-secondary small mb-3">loading@gmail.com</p>

                        <hr class="border-secondary my-2">

                        <li>
                            <button id="logout-btn"
                                class="btn btn-sm btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 py-2"
                                style="border-radius: 8px;">
                                <i class="fa-solid fa-right-from-bracket"></i> Logout Account
                            </button>
                        </li>
                    </ul>
                </div>

            </div>
        </div>
    </nav>

    <!-- Main Workspace Container: 2-Column Desktop Grid Split -->
    <main class="container py-4 px-3 px-md-4">
        <div class="row g-4">

            <!-- 1. REPORT FORM (Mobile & Desktop dono par pehle aayega) -->
            <div class="col-12 col-lg-4 order-1 sticky-form-container">
                <div class="card p-3 p-md-4 text-white"
                    style="background-color: #121929; border: 1px solid #1e293b; border-radius: 18px;">
                    <h4 class="text-info fw-bold mb-3 d-flex align-items-center gap-2">
                        <i class="fa-solid fa-pen-to-square"></i> Report An Item
                    </h4>

                    <form id="post-form">
                        <!-- Item Title -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small">Item Title / Name</label>
                            <input type="text" id="item-name" class="form-control bg-dark text-white border-secondary"
                                placeholder="e.g., Black iPhone 13" required>
                        </div>

                        <!-- Status Toggle -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small d-block">Current Status</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="item-status-toggle" id="status-lost"
                                    value="Lost" checked>
                                <label class="btn btn-outline-danger fw-bold" for="status-lost">Lost Item</label>

                                <input type="radio" class="btn-check" name="item-status-toggle" id="status-found"
                                    value="Found">
                                <label class="btn btn-outline-success fw-bold" for="status-found">Found Item</label>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small">Description / Location</label>
                            <textarea id="item-desc" class="form-control bg-dark text-white border-secondary" rows="3"
                                placeholder="Describe unique features..."></textarea>
                        </div>

                        <!-- Image Upload -->
                        <div class="mb-3">
                            <label class="form-label text-secondary small d-block">Visual Evidence / Image</label>

                            <div class="d-flex align-items-center gap-2 flex-wrap mb-2">
                                <label for="item-image" class="btn btn-info text-white fw-semibold mb-0">
                                    <i class="fa-solid fa-image me-1"></i> Choose Photo
                                </label>
                                <input type="file" id="item-image" class="d-none" accept="image/*">
                                <span id="file-name-display" class="text-secondary small text-truncate"
                                    style="max-width: 150px;">No photo attached</span>
                            </div>


                            <!-- Image Preview Container (Centered) -->
                            <div class="text-center w-100">
                                <img id="image-preview" src="" alt="Preview"
                                    class="img-fluid rounded mt-2 d-none mx-auto"
                                    style="max-height: 160px; object-fit: cover; border: 1px solid #334155;">
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="submit-post-btn"
                            class="btn btn-info w-100 text-white fw-bold py-2 mt-2" style="border-radius: 12px;">
                            Broadcast Report <i class="fa-solid fa-paper-plane ms-1"></i>
                        </button>
                    </form>
                </div>
            </div>

            <!-- 2. RECENT REPORTS / CARDS FEED (Hamesha Form ke baad aayega) -->
            <div class="col-12 col-lg-8 order-2">
                <!-- Recent Reports Header with Integrated Search & Filter Bar -->


                <!-- Recent Reports Header (Clean with Tab Controls Only) -->
                <!-- Recent Reports Header (With Resolved Tab) -->
                <div class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-3">

                    <!-- Title Section -->
                    <div>
                        <h3 class="fw-bold text-white mb-0">Recent Reports</h3>
                        <p class="text-secondary small mb-0" style="font-size: 0.85rem;">Live crowd-sourced local
                            database status</p>
                    </div>

                    <!-- Segmented Tab Group (All, Lost, Found, Resolved) -->
                    <div class="filter-tab-group d-flex p-1 rounded-3"
                        style="background-color: #0f172a; border: 1px solid #334155;">
                        <button type="button"
                            class="btn btn-sm text-white filter-btn active-tab px-3 py-1 rounded-2 fw-semibold"
                            data-filter="all">All Items</button>
                        <button type="button"
                            class="btn btn-sm text-secondary filter-btn px-3 py-1 rounded-2 fw-semibold"
                            data-filter="lost">Lost</button>
                        <button type="button"
                            class="btn btn-sm text-secondary filter-btn px-3 py-1 rounded-2 fw-semibold"
                            data-filter="found">Found</button>
                        <button type="button"
                            class="btn btn-sm text-secondary filter-btn px-3 py-1 rounded-2 fw-semibold"
                            data-filter="resolved">Resolved</button>
                    </div>

                </div>


                <!-- Feed Cards Container -->
                <div id="posts-container" class="row row-cols-1 row-cols-md-2 g-3">
                    <!-- JS se cards yahan render honge -->
                </div>
            </div>

        </div>
    </main>

    </div>

    <!-- Third-Party Execution Engines -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Core JS System Integration -->
    <script type="module" src="JS/dashboard.js"></script>
</body>

</html>

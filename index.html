<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found App | Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="CSS/auth.css">
    <style>
       
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header text-center mb-4">
            <div class="mb-2">
                <i class="fa-solid fa-circle-nodes fa-3x" style="color: #10b981;"></i>
            </div>
            <h3>lost or found app</h3>
            <p class="text-secondary small">Create your account to get started!</p>
        </div>

        <!-- Dynamic Form Tabs -->
        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="pills-signup-tab" data-bs-toggle="pill" data-bs-target="#pills-signup" type="button" role="tab">
                    <i class="fa-solid fa-user-plus me-2"></i>Sign Up
                </button>
            </li>
        </ul>

        <!-- Forms View Switcher -->
        <div class="tab-content" id="pills-tabContent">
            
            <!-- 🔑 USER LOGIN FORM -->
            <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth w-100">
                        Login Account <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
                    </button>
                </form>
            </div>

            <!-- 📝 USER SIGNUP FORM -->
            <div class="tab-pane fade" id="pills-signup" role="tabpanel">
                <form id="signupForm">
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="jhon" required>
                        </div>
                        <div class="col-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Deo" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="signEmail" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" id="signEmail" placeholder="admin@gmail.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="signNumber" class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                            <input type="text" class="form-control" id="signNumber" placeholder="+92 300 1234567" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="signPassword" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                            <input type="password" class="form-control" id="signPassword" placeholder="••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-auth w-100">
                        Sign Up <i class="fa-solid fa-user-check ms-2"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Script Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Link your JS module script execution here -->
    <script type="module" src="JS/auth.js"></script>
</body>
</html>
